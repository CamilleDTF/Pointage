<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10416b">
  <title>Pointage — Tableau de bord</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="appbar">
    <div class="titre">
      Pointage hebdomadaire — Direction
      <small id="entete-nom">…</small>
    </div>
    <nav>
      <button class="petit discret" id="btn-admin" type="button">Paramètres</button>
      <button class="petit discret" id="btn-quitter" type="button">Quitter</button>
    </nav>
  </header>

  <!--
    L'accueil repond a trois questions, dans cet ordre : de quelle semaine
    parle-t-on, qu'est-ce qui m'attend, et ou en est chacun.

    Les fiches n'y sont plus depliees. Elles occupaient quatre grilles de saisie
    de onze lignes sur sept jours — sept mille pixels a traverser pour atteindre
    le suivi, qu'on venait justement consulter. Une fiche s'ouvre desormais sur
    son propre ecran, quand on a decide de s'en occuper.

    La barre de navigation a fondu de cinq boutons a deux : le mois a une seule
    porte, en bas, au lieu de quatre destinations aux noms voisins.
  -->
  <main>
    <section class="carte">
      <div class="bandeau-semaine">
        <span class="quand" id="quand">Semaine —</span>
        <span class="dates" id="periode"></span>
        <span class="actions">
          <button class="petit" id="btn-precedente" type="button">◀ Précédente</button>
          <button class="petit" id="btn-suivante" type="button">Suivante ▶</button>
          <button class="petit" id="btn-autre" type="button">Une autre semaine…</button>
        </span>
      </div>

      <div class="rangee detache masque" id="choix-semaine">
        <div class="champ-court">
          <label for="annee">Année</label>
          <input id="annee" type="number" min="2020" max="2100" step="1">
        </div>
        <div class="champ-court">
          <label for="semaine">Semaine n°</label>
          <input id="semaine" type="number" min="1" max="53" step="1">
        </div>
        <button class="principal" id="btn-charger" type="button">Afficher</button>
      </div>

      <div class="jauge-semaine">
        <div class="piste">
          <div class="part validee" id="part-validee"></div>
          <div class="part rendue" id="part-rendue"></div>
        </div>
        <p class="legende" id="contexte-semaine"></p>
      </div>
    </section>

    <section class="carte" id="bloc-appels">
      <h2>Ce qui vous attend</h2>
      <div id="appels"></div>
    </section>

    <section class="carte">
      <div class="barre-outils detache-apres">
        <h2 class="serree" id="titre-chefs">Les chefs cette semaine</h2>
        <div class="actions">
          <div class="champ-moyen">
            <label for="portee-export">Contenu de l'export</label>
            <select id="portee-export">
              <option value="validee">Fiches validées</option>
              <option value="">Toutes les fiches</option>
              <option value="soumise">Fiches à vérifier</option>
            </select>
          </div>
          <button class="petit" id="btn-export-xlsx" type="button">Export Excel</button>
          <button class="petit" id="btn-export-csv" type="button">Export CSV</button>
        </div>
      </div>
      <div class="chefs" id="chefs"></div>
    </section>

    <!--
      Une porte, et non quatre.

      Il y avait ici « Tableau mensuel », « Calendrier du mois », « Non
      productif » et « Paie non productif » : quatre destinations de meme poids,
      dont trois se ressemblent par le nom, et rien ne disait laquelle ouvrir ni
      dans quel ordre. Le mois n'a qu'une question — ou en est la paie.
    -->
    <section class="carte">
      <div class="barre-outils detache-apres">
        <h2 class="serree">La paie du mois</h2>
        <div class="actions">
          <button class="petit" id="btn-calendrier" type="button">Les congés du mois</button>
          <button class="petit" id="btn-non-productif" type="button">Non productif</button>
          <button class="principal" id="btn-mensuel" type="button">Ouvrir la paie</button>
        </div>
      </div>
      <div id="etat-mois"></div>
    </section>
  </main>

  <script src="/js/regles.js"></script>
  <script src="/js/commun.js"></script>
  <script src="/js/directeur.js"></script>
</body>
</html>
