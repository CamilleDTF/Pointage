<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10416b">
  <title>Pointage — Tableau mensuel</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="appbar">
    <div class="titre">
      Tableau mensuel pour la paie
      <small id="entete-nom">…</small>
    </div>
    <button class="petit" id="btn-retour" type="button">◀ Tableau de bord</button>
    <button class="petit" id="btn-quitter" type="button">Quitter</button>
  </header>

  <main>
    <section class="carte">
      <div class="rangee">
        <div style="width:150px">
          <label for="mois">Mois</label>
          <select id="mois"></select>
        </div>
        <div style="width:110px">
          <label for="annee-mois">Année</label>
          <input id="annee-mois" type="number" min="2020" max="2100" step="1">
        </div>
        <div style="width:230px">
          <label for="version-mois">Version</label>
          <select id="version-mois">
            <option value="public">Publique — heures et primes</option>
            <option value="direction">Direction — avec les montants</option>
          </select>
        </div>
        <button class="principal" id="btn-voir-mois" type="button">Afficher</button>
        <button class="valide" id="btn-export-mois" type="button">Télécharger</button>
        <span class="pousse"></span>
        <p class="aide" id="apercu-mois" style="margin:0;text-align:right;max-width:380px"></p>
      </div>

      <div class="rangee masque" id="bloc-panier" style="margin-top:10px">
        <span class="aide" style="margin:0">
          Panier repas : <strong>12,20 € par jour travaillé</strong>, hors jours de grand
          déplacement — l'indemnité de déplacement comprend déjà le repas. Rien à saisir :
          le montant est fixe et les jours se comptent depuis le pointage.
        </span>
        <span class="pousse"></span>
        <button class="petit" id="btn-verrouiller" type="button">Masquer les montants</button>
      </div>
    </section>

    <section class="carte">
      <div id="tableau-mois"></div>
    </section>
  </main>

  <script src="/js/regles.js"></script>
  <script src="/js/commun.js"></script>
  <script src="/js/mensuel.js"></script>
</body>
</html>
