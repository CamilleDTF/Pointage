<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10416b">
  <title>Pointage — mes fiches à viser</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="appbar">
    <div class="titre">
      Fiches à viser
      <small id="entete-conducteur">…</small>
    </div>
    <button class="petit" id="btn-rafraichir" type="button">Actualiser</button>
    <button class="petit masque" id="btn-quitter" type="button">Quitter</button>
  </header>

  <main>
    <section class="carte" id="bloc-erreur" hidden>
      <h2>Impossible d'afficher vos fiches</h2>
      <p class="aide" id="texte-erreur"></p>
      <p class="aide">
        Reconnectez-vous, ou signalez-le à la direction si le message persiste.
      </p>
    </section>

    <div id="contenu" hidden>
      <section class="carte">
        <h2>En attente de votre visa</h2>
        <p class="aide" id="resume-attente"></p>
        <div id="liste-attente"></div>
      </section>

      <!--
        Ce qui n'est pas arrive.

        L'ecran ne montrait que les fiches transmises : une semaine ou personne
        n'envoie rien laissait un ecran vide, ou l'on ne distingue pas « tout
        est vise » de « personne n'a rien fait ». Relancer un chef qui a oublie
        est pourtant le role du conducteur.
      -->
      <section class="carte" id="bloc-manquantes" hidden>
        <h2 id="titre-manquantes">Pointages qui manquent</h2>
        <p class="aide detache-apres" id="resume-manquantes"></p>
        <div class="chefs" id="liste-manquantes"></div>
      </section>

      <section class="carte" id="bloc-recentes" hidden>
        <h2>Vos derniers visas</h2>
        <div id="liste-recentes"></div>
      </section>

      <section class="carte">
        <p class="aide serree" id="note-page"></p>
      </section>
    </div>
  </main>

  <script src="/js/regles.js"></script>
  <script src="/js/commun.js"></script>
  <script src="/js/conducteur.js"></script>
</body>
</html>
