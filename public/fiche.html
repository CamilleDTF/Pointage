  <header class="appbar">
    <div class="titre retour-accueil" role="link" tabindex="0" title="Revenir au tableau de bord" data-accueil="/accueil.html">

    </div>
    <nav>
      <button class="petit" id="btn-retour" type="button">◀ Tableau de bord</button>

  <!--
    Une fiche, une adresse.

    Elles se depliaient toutes sur le tableau de bord, les unes sous les autres :
    quatre grilles de onze lignes sur sept jours qu'il fallait traverser pour
    atteindre le suivi. Ouvrir une fiche est une decision — elle a donc son
    ecran, et le tableau de bord retrouve sa hauteur.
  -->
  <main>
    <div id="fiche"></div>
  </main>
