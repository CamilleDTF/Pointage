<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10416b">
  <title>Pointage — Tableau de bord</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="appbar">
    <div class="titre">
      Pointage hebdomadaire — Direction
      <small id="entete-nom">…</small>
    </div>
    <nav>
      <button class="petit" id="btn-mensuel-haut" type="button">Tableau mensuel</button>
      <button class="petit" id="btn-calendrier" type="button">Calendrier</button>
      <button class="petit" id="btn-non-productif" type="button">Non productif</button>
      <span class="separateur-nav"></span>
      <button class="petit discret" id="btn-admin" type="button">Paramètres</button>
      <button class="petit discret" id="btn-quitter" type="button">Quitter</button>
    </nav>
  </header>

  <main>
    <section class="carte">
      <div class="rangee">
        <div class="champ-court">
          <label for="annee">Année</label>
          <input id="annee" type="number" min="2020" max="2100" step="1">
        </div>
        <div class="champ-court">
          <label for="semaine">Semaine n°</label>
          <input id="semaine" type="number" min="1" max="53" step="1">
        </div>
        <button class="principal" id="btn-charger" type="button">Afficher</button>
        <button class="petit" id="btn-precedente" type="button">◀ Précédente</button>
        <button class="petit" id="btn-suivante" type="button">Suivante ▶</button>
        <span class="pousse"></span>
        <div class="champ-moyen">
          <label for="portee-export">Contenu de l'export</label>
          <select id="portee-export">
            <option value="validee">Fiches validées</option>
            <option value="">Toutes les fiches</option>
            <option value="soumise">Fiches à vérifier</option>
          </select>
        </div>
        <button class="valide" id="btn-export-xlsx" type="button">Export Excel</button>
        <button id="btn-export-csv" type="button">Export CSV</button>
      </div>
      <p class="aide" id="periode"></p>
    </section>

    <!--
      Trois cartes pleine largeur menaient ici vers trois ecrans que la barre du
      haut proposait deja : la meme navigation, deux fois, et le contenu reel du
      tableau de bord repousse sous la ligne de flottaison. Il en reste une
      rangee de raccourcis — qui garde ce que la barre ne peut pas dire :
      l'apercu du mois en cours.
    -->
    <section class="carte">
      <div class="barre-outils">
        <div>
          <h2 class="serree">Préparer la paie</h2>
          <p class="aide suite" id="apercu-mois"></p>
        </div>
        <div class="actions">
          <button class="petit" id="btn-calendrier-bas" type="button">Calendrier du mois</button>
          <button class="petit" id="btn-non-productif-bas" type="button">Non productif</button>
          <button class="petit" id="btn-paie-non-productif" type="button">Paie non productif</button>
          <button class="principal" id="btn-mensuel" type="button">Tableau mensuel</button>
        </div>
      </div>
    </section>

    <section class="indicateurs" id="indicateurs"></section>

    <section class="carte detache">
      <h2>Suivi des chefs d'équipe</h2>
      <div class="enveloppe-table">
        <table id="suivi">
          <thead>
            <tr>
              <th>Chef d'équipe</th><th>Chantier</th><th>Ville</th>
              <th class="num">Salariés</th><th class="num">Total heures</th>
              <th>État</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div id="fiches"></div>

  </main>

  <script src="/js/regles.js"></script>
  <script src="/js/commun.js"></script>
  <script src="/js/directeur.js"></script>
</body>
</html>
